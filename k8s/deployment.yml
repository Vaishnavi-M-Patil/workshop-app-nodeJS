apiVersion: apps/v1
kind: Deployment
metadata: 
  name: node-deployment
  namespace: node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-app
  template:
    metadata: 
      name: node-app-pod
      namespace: node
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: vaishnavimpatil/node-app
        ports: 
        - containerPort: 3000
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: mysql-config
              key: host           
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: mysql-config
              key: user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: password
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: mysql-config
              key: db_name
---

apiVersion: v1
kind: Service
metadata:
  name: node-app-service
  namespace: node
spec:
  type: NodePort 
  selector:
    app: node-app
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000
