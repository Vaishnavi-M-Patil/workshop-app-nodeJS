<!DOCTYPE html>
<html>
<head>
  <title>Dummy Music Player</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:
        linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 15, 20, 0.95)),
        url('https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
      background-size: cover;
      color: #d0f0f8;
      text-align: center;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 0 1rem 0;
    }

    nav {
      background: rgba(0, 18, 25, 0.85);
      padding: 1rem 2rem;
      display: flex;
      justify-content: center;
      gap: 3rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.95);
      position: sticky;
      top: 0;
      z-index: 110;
      font-weight: 700;
      font-size: 1.2rem;
      text-transform: uppercase;
    }

    nav a {
      color: #d0f0f8;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 12px;
      transition: color 0.3s ease, background 0.3s ease;
    }

    nav a.active,
    nav a:hover {
      color: #00262f;
      background: #4cf0ff;
      box-shadow: inset 0 0 15px #4cf0ff;
    }

    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding-bottom: 2rem;
    }

    h1 {
      margin: 2.5rem 0 0.5rem;
      text-shadow: 2px 3px 12px rgba(76, 240, 255, 0.8);
      font-weight: 900;
      font-size: 3rem;
      letter-spacing: 0.12em;
    }

    .subtitle {
      color: #8ef0ff;
      margin-bottom: 2rem;
      font-style: italic;
      font-size: 1.35rem;
      text-shadow: 1px 1.5px 4px rgba(76, 240, 255, 0.5);
    }

    /* Song grid styling */
    #songList {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      justify-items: center;
      padding: 0 1rem;
    }

    .song-item {
      background: rgba(10, 25, 28, 0.85);
      border-radius: 18px;
      padding: 0.8rem 1rem;
      box-shadow: 0 6px 20px rgba(76, 240, 255, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      max-width: 320px;
    }

    .song-item:hover {
      transform: scale(1.03);
      box-shadow: 0 10px 28px rgba(76, 240, 255, 0.6);
    }

    .song-title {
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    audio {
      width: 100%;
      border-radius: 12px;
    }

    /* Glowing highlight on playing song */
    .song-item.playing {
      box-shadow: 0 0 25px 6px #4cf0ff;
      transform: scale(1.05);
      transition: box-shadow 0.4s ease, transform 0.3s ease;
    }

    footer {
      padding: 1.8rem 2rem;
      font-size: 1.1rem;
      color: #4cf0ff;
      font-weight: 700;
      text-shadow: 0 0 15px #4cf0ff;
      border-top: 2px solid rgba(76, 240, 255, 0.35);
      background: rgba(0, 0, 0, 0.55);
      border-radius: 18px 18px 0 0;
      box-shadow: inset 0 3px 22px rgba(76, 240, 255, 0.3);
      text-align: center;
      flex-shrink: 0;
    }

    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        gap: 1.6rem;
      }
      h1 {
        font-size: 2.4rem;
      }
      .subtitle {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="#" class="active">Home</a>
    <a href="#">Songs</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <main>
    <h1>Dummy Music Player</h1>
    <div class="subtitle">Feel the Beat, Live the Moment</div>
    <div id="songList"></div>
  </main>

  <footer>
    &copy; 2025 Dummy Music Player. Built with passion by a music lover.
  </footer>

  <script>
    async function loadSongs() {
      try {
        const response = await fetch('/api/songs');
        const songs = await response.json();  // Your 25 songs data
        const songList = document.getElementById('songList');
        songList.innerHTML = '';

        songs.forEach((song, index) => {
          const div = document.createElement('div');
          div.className = 'song-item';

          const title = document.createElement('div');
          title.className = 'song-title';
          title.textContent = `${index + 1}. ${song.name} - ${song.artist}`;

          const audio = document.createElement('audio');
          audio.controls = true;
          audio.src = '/' + song.url;

          // When a song ends, play the next
          audio.addEventListener('ended', () => {
            const nextAudio = songList.querySelectorAll('audio')[index + 1];
            if (nextAudio) nextAudio.play();
          });

          // Play event: pause others and highlight current
          audio.addEventListener('play', () => {
            document.querySelectorAll('audio').forEach(a => {
              if (a !== audio) {
                a.pause();
                a.currentTime = 0;
                a.parentElement.classList.remove('playing');
              }
            });
            audio.parentElement.classList.add('playing');
          });

          div.appendChild(title);
          div.appendChild(audio);
          songList.appendChild(div);
        });
      } catch (err) {
        console.error('Failed to load songs:', err);
      }
    }

    window.onload = loadSongs;
  </script>
</body>
</html>
